const gpos=new Float32Array(gv), gnrm=new Float32Array(gn);

const vs=`attribute vec3 aPos;attribute vec3 aNrm;
uniform mat4 uMVP;varying vec3 vN;varying vec3 vP;
void main(){vN=aNrm;vP=aPos;gl_Position=uMVP*vec4(aPos,1.0);}`;
const fs=`precision highp float;varying vec3 vN;varying vec3 vP;
uniform vec3 uEye;uniform float uFlat;
void main(){
  if(uFlat>0.5){gl_FragColor=vec4(0.80,0.84,0.90,1.0);return;}
  vec3 n=normalize(vN);
  vec3 L1=normalize(vec3(-0.42,0.50,0.76));
  vec3 L2=normalize(vec3(0.65,-0.30,0.35));
  vec3 V=normalize(uEye-vP);
  float d1=max(dot(n,L1),0.0);
  float d2=max(dot(n,L2),0.0);
  float sp=pow(max(dot(n,normalize(L1+V)),0.0),48.0);
  vec3 base=vec3(0.60,0.68,0.82);
  vec3 col=base*(0.36+0.52*d1+0.26*d2)+0.32*sp;
  gl_FragColor=vec4(pow(col,vec3(0.4545)),1.0);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr); gl.useProgram(pr);
const aPos=gl.getAttribLocation(pr,"aPos"), aNrm=gl.getAttribLocation(pr,"aNrm");
const uMVP=gl.getUniformLocation(pr,"uMVP"), uEye=gl.getUniformLocation(pr,"uEye"),
      uFlat=gl.getUniformLocation(pr,"uFlat");

function buf(arr){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);return b;}
const bP=buf(pos), bN=buf(nrm), bGP=buf(gpos), bGN=buf(gnrm);

function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function nrmz(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function mul(a,b){const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
    for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function persp(f,a,n,fa){const t=1/Math.tan(f/2),o=new Float32Array(16);
  o[0]=t/a;o[5]=t;o[10]=(fa+n)/(n-fa);o[11]=-1;o[14]=2*fa*n/(n-fa);return o;}
function lookAt(e,c,up){const zz=nrmz(sub(e,c)),x=nrmz(cross(up,zz)),y=cross(zz,x);
  return new Float32Array([x[0],y[0],zz[0],0,x[1],y[1],zz[1],0,x[2],y[2],zz[2],0,
    -dot(x,e),-dot(y,e),-dot(zz,e),1]);}

let yaw=-0.95, pitch=0.62, dist=rad*3.4, drag=false, lx=0, ly=0, idle=0;
canvas.addEventListener("pointerdown",e=>{drag=true;idle=0;lx=e.clientX;ly=e.clientY;
  canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointermove",e=>{if(!drag)return;
  yaw-=(e.clientX-lx)*0.008;
  pitch=Math.max(-0.25,Math.min(1.45,pitch+(e.clientY-ly)*0.006));
  lx=e.clientX;ly=e.clientY;});
canvas.addEventListener("wheel",e=>{dist=Math.min(rad*9,Math.max(rad*0.9,
  dist*Math.exp(e.deltaY*0.0012)));e.preventDefault();},{passive:false});

function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height);}
window.addEventListener("resize",resize);

gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.cullFace(gl.BACK);
gl.clearColor(0.933,0.949,0.971,1);

function frame(){
  resize();
  if(!drag){idle++; if(idle>40) yaw+=0.0018;}
  const ce=Math.cos(pitch);
  const eye=[ctr[0]+dist*ce*Math.cos(yaw),ctr[1]+dist*ce*Math.sin(yaw),ctr[2]+dist*Math.sin(pitch)];
  const vp=persp(Math.PI/5.2,canvas.width/canvas.height,1,rad*40);
  const mvp=mul(vp,lookAt(eye,ctr,[0,0,1]));
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  gl.uniformMatrix4fv(uMVP,false,mvp);
  gl.uniform3fv(uEye,new Float32Array(eye));
  gl.uniform1f(uFlat,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bP);gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bN);gl.enableVertexAttribArray(aNrm);
  gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,nt*3);

  gl.uniform1f(uFlat,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,bGP);gl.bindBuffer(gl.ARRAY_BUFFER,bGP);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bGN);
  gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.LINES,0,gpos.length/3);

  requestAnimationFrame(frame);
}
frame();
</script></body></html>
